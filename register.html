<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RESQNET | Register</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="page-container">

        <div class="login-card">

            <!-- RESQNET BRAND -->

            <div class="brand">

                <div class="brand-logo"></div>

                <h1>
                    RESQ<span>NET</span>
                </h1>

                <p>
                    School Assistance Alert & Response System
                </p>

            </div>


            <!-- SYSTEM STATUS -->

            <div class="system-status">

                <span class="status-dot"></span>

                SYSTEM ONLINE

            </div>


            <!-- REGISTER HEADER -->

            <div class="form-header">

                <div class="eyebrow">
                    NEW ACCOUNT
                </div>

                <h2>
                    Create Account
                </h2>

                <p>
                    Register to access the RESQNET system.
                </p>

            </div>


            <!-- REGISTER FORM -->

            <form id="registerForm">


                <!-- FULL NAME -->

                <div class="mb-3 text-start">

                    <label
                        for="fullname"
                        class="form-label"
                    >
                        Full Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                    >

                </div>


                <!-- EMAIL -->

                <div class="mb-3 text-start">

                    <label
                        for="register-email"
                        class="form-label"
                    >
                        Email Address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="register-email"
                        name="email"
                        placeholder="Enter your email"
                    >

                </div>


                <!-- PASSWORD -->

                <div class="mb-3 text-start">

                    <label
                        for="register-password"
                        class="form-label"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="register-password"
                        name="register_password"
                        placeholder="Create a password"
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="mb-3 text-start">

                    <label
                        for="confirm-password"
                        class="form-label"
                    >
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="confirm-password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                    >

                </div>


                <!-- REGISTER MESSAGE -->

                <div id="register-message"></div>


                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Account
                </button>

            </form>


            <!-- BACK TO LOGIN -->

            <div class="account-link">

                Already have an account?

                <a href="login.html">
                    Back to Login
                </a>

            </div>

        </div>

    </main>


    <!-- SCRIPTS -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script
        src="https://cdn.jsdelivr.net/npm/jquery-validation@1.21.0/dist/jquery.validate.min.js"
    ></script>

    <script src="script.js"></script>

</body>

</html>
